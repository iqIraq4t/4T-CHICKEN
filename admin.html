<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم 4T CHICKEN</title>
  <style>
    body { font-family: "Tajawal", sans-serif; background: #10110f; color: #f7f5ee; padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: auto; background: #191b17; padding: 25px; border-radius: 12px; border: 1px solid #30332a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1, h2 { text-align: center; color: #ffc431; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #d7d8c9; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3b4431; background: #22241e; color: white; font-family: inherit; font-size: 15px; box-sizing: border-box; }
    input:focus, select:focus { border-color: #ffc431; outline: none; }
    button { background: #ffc431; color: #10110f; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; font-size: 16px; transition: 0.2s; }
    button:hover { background: #ffd263; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    .btn-danger { background: #ee4636; color: white; width: auto; padding: 6px 15px; margin: 0; font-size: 14px;}
    .btn-danger:hover { background: #ff7561; }
    .btn-edit { background: #007bff; color: white; width: auto; padding: 6px 15px; margin: 0 5px 0 0; font-size: 14px; }
    .btn-edit:hover { background: #0056b3; }
    .btn-cancel { background: #6c757d; color: white; display: none; margin-top: 10px; }
    .hidden { display: none; }
    .product-item { display: flex; justify-content: space-between; align-items: center; background: #22241e; padding: 12px; margin-bottom: 10px; border-radius: 8px; border-right: 4px solid #ffc431; }
    .product-info h4 { margin: 0 0 5px 0; font-size: 16px; }
    .product-info p { margin: 0; font-size: 13px; color: #a3a59a; }
    .product-actions { display: flex; gap: 5px; }
    .logout-btn { background: transparent; border: 1px solid #ee4636; color: #ee4636; width: auto; margin-bottom: 20px; padding: 8px 20px; }
    .logout-btn:hover { background: #ee4636; color: white; }
    .box { background: #10150d; padding: 20px; border-radius: 10px; border: 1px solid #303925; margin-bottom: 25px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .product-item { flex-direction: column; align-items: flex-start; gap: 10px; } }
    #msg, #promoMsg, #bulkMsg { text-align: center; font-weight: bold; margin-top: 15px; font-size: 15px; }
    
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: thin; }
    .filter-btn { width: auto; padding: 8px 15px; margin: 0; background: #22241e; color: #a3a59a; border: 1px solid #3b4431; border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .filter-btn:hover { background: #303925; color: white; }
    .filter-btn.active { background: #ffc431; color: #10110f; border-color: #ffc431; font-weight: bold; }
    .stock-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-top: 5px; }
    .stock-in { background: #1b3a1b; color: #4caf50; border: 1px solid #2e5c2e; }
    .stock-out { background: #3a1b1b; color: #ee4636; border: 1px solid #5c2e2e; }
  </style>
</head>
<body>

  <div class="container">
    <div id="loginSection">
      <h1>تسجيل دخول الأدمن</h1>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="********">
      </div>
      <button onclick="login()">دخول</button>
      <p id="loginError" style="color: #ee4636; text-align: center; margin-top: 10px;"></p>
    </div>

    <div id="adminSection" class="hidden">
      <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
      <h1>لوحة تحكم 4T CHICKEN</h1>
      
      <!-- صندوق الرفع السريع -->
      <div class="box" style="border-color: #ffc431; text-align: center;">
        <h2>🚀 الرفع السريع (المنيو الكامل)</h2>
        <p style="font-size: 13px; color: #a3a59a; margin-bottom: 15px;">اضغط هنا لإضافة جميع الوجبات الـ 24 (مع توفير 50 قطعة لكل وجبة).</p>
        <button onclick="bulkUpload()" id="bulkUploadBtn" style="background: #4caf50; color: white;">🚀 رفع جميع الوجبات</button>
        <p id="bulkMsg"></p>
      </div>

      <!-- صندوق صورة العرض -->
      <div class="box" style="border-color: #ffc431;">
        <h2>🖼️ إدارة صورة العرض (البانر)</h2>
        <div class="form-group">
          <input type="url" id="promoImageUrl" placeholder="https://example.com/promo.png" dir="ltr">
        </div>
        <button type="button" onclick="updatePromoImage()">تحديث صورة العرض</button>
        <p id="promoMsg"></p>
      </div>

      <!-- صندوق إضافة / تعديل وجبة -->
      <div class="box">
        <h2 id="formTitle">🍔 إضافة / تعديل وجبة</h2>
        <form id="addForm">
          <input type="hidden" id="editProductId" value="">
          
          <div class="grid-2">
            <div class="form-group">
              <label>اسم الوجبة</label>
              <input type="text" id="prodName" placeholder="مثال: بركر دجاج كلاسيك" required>
            </div>
            <div class="form-group">
              <label>السعر (دينار عراقي)</label>
              <input type="number" id="prodPrice" placeholder="مثال: 4000" required>
            </div>
          </div>
          
          <div class="grid-2">
            <div class="form-group">
              <label>القسم (التصنيف)</label>
              <select id="prodCategory" required>
                <option value="" disabled selected>-- اختر القسم --</option>
                <option value="sandwiches">السندويشات</option>
                <option value="saj">الصاج</option>
                <option value="burgers">البركر</option>
                <option value="risotto">الريزو</option>
                <option value="chicken">وجبات الكنتاكي</option>
                <option value="family">بوكس فورتي العائلي</option>
                <option value="snacks">الوجبات الخفيفة</option>
                <option value="drinks">المشروبات الغازية</option>
              </select>
            </div>
            <!-- 🟢 هنا خانة الكمية المتوفرة -->
            <div class="form-group">
              <label style="color: #ffc431;">الكمية المتوفرة (المخزون)</label>
              <input type="number" id="prodStock" placeholder="مثال: 50" min="0" required>
            </div>
          </div>

          <div class="form-group">
            <label>رابط الصورة (اختياري)</label>
            <input type="url" id="prodImage" placeholder="https://example.com/image.jpg" dir="ltr">
          </div>

          <button type="submit" id="submitBtn">إضافة الوجبة للموقع</button>
          <button type="button" class="btn-cancel" id="cancelEditBtn" onclick="cancelEdit()">إلغاء التعديل</button>
        </form>
        <p id="msg"></p>
      </div>

      <h2 style="margin-top: 30px;">📋 إدارة الوجبات الحالية</h2>
      
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">الكل</button>
        <button class="filter-btn" data-filter="sandwiches" onclick="setFilter('sandwiches')">السندويشات</button>
        <button class="filter-btn" data-filter="saj" onclick="setFilter('saj')">الصاج</button>
        <button class="filter-btn" data-filter="burgers" onclick="setFilter('burgers')">البركر</button>
        <button class="filter-btn" data-filter="risotto" onclick="setFilter('risotto')">الريزو</button>
        <button class="filter-btn" data-filter="chicken" onclick="setFilter('chicken')">الكنتاكي</button>
        <button class="filter-btn" data-filter="family" onclick="setFilter('family')">العائلي</button>
        <button class="filter-btn" data-filter="snacks" onclick="setFilter('snacks')">الوجبات الخفيفة</button>
        <button class="filter-btn" data-filter="drinks" onclick="setFilter('drinks')">المشروبات</button>
      </div>

      <div id="productsList" style="max-height: 450px; overflow-y: auto;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfY81QxRJak4X2h7PWjCkFPK9-9g7btDI",
      authDomain: "t-chicken.firebaseapp.com",
      projectId: "t-chicken",
      storageBucket: "t-chicken.firebasestorage.app",
      messagingSenderId: "354053502502",
      appId: "1:354053502502:web:bce801d4ba6a2ae46a58e7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allProducts = [];
    let currentFilter = 'all';
    const catNames = {
      sandwiches: "السندويشات", saj: "الصاج", burgers: "البركر", risotto: "الريزو",
      chicken: "وجبات الكنتاكي", family: "العائلي", snacks: "الوجبات الخفيفة", drinks: "المشروبات"
    };

    window.login = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        document.getElementById("loginError").innerText = "";
      } catch (error) {
        document.getElementById("loginError").innerText = "خطأ في البريد أو كلمة المرور";
      }
    };

    window.logout = () => { signOut(auth); };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("adminSection").classList.remove("hidden");
        loadProducts();
      } else {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("adminSection").classList.add("hidden");
      }
    });

    window.bulkUpload = async () => {
      const btn = document.getElementById("bulkUploadBtn");
      const msg = document.getElementById("bulkMsg");
      
      btn.disabled = true;
      btn.innerText = "جاري رفع الوجبات...";
      msg.innerText = "";

      const initialMenu = [
        { id: "shawarma-sandwich", name: "شاورما دجاج ساندويش", price: 2500, category: "sandwiches", stock: 50, crop: [21, 398, 116, 86] },
        { id: "fajita-sandwich", name: "فاهيتا دجاج ساندويش", price: 4000, category: "sandwiches", stock: 50, crop: [142, 397, 114, 87] },
        { id: "zinger-sandwich", name: "زنكر ساندويش", price: 4000, category: "sandwiches", stock: 50, crop: [265, 397, 106, 88] },
        { id: "saj-roll", name: "لفة صاج", price: 2000, category: "saj", stock: 50, crop: [389, 399, 104, 87] },
        { id: "saj-meal", name: "وجبة صاج", price: 5000, category: "saj", stock: 50, crop: [494, 401, 100, 84] },
        { id: "saj-tortilla", name: "تورتيلا صاج", price: 4000, category: "saj", stock: 50, crop: [597, 401, 97, 84] },
        { id: "chicken-burger", name: "بركر دجاج كلاسيك", price: 4000, category: "burgers", stock: 50, crop: [23, 580, 111, 96] },
        { id: "beef-burger", name: "بركر لحم كلاسيك", price: 5000, category: "burgers", stock: 50, crop: [141, 580, 102, 96] },
        { id: "double-burger", name: "بركر فور تي دبل", price: 7000, category: "burgers", stock: 50, crop: [256, 580, 99, 96] },
        { id: "rizo", name: "ريزو", price: 5000, category: "risotto", stock: 50, crop: [372, 590, 79, 83] },
        { id: "rizo-shawarma", name: "ريزو شاورما", price: 5500, category: "risotto", stock: 50, crop: [456, 593, 78, 80] },
        { id: "rizo-spicy", name: "ريزو سبايسي", price: 5500, category: "risotto", stock: 50, crop: [536, 590, 79, 83] },
        { id: "rizo-smoked", name: "ريزو مدخن", price: 5500, category: "risotto", stock: 50, crop: [618, 592, 75, 81] },
        { id: "chicken-3", name: "وجبة كنتاكي 3 قطع", price: 8000, category: "chicken", stock: 50, crop: [30, 778, 95, 89] },
        { id: "chicken-5", name: "وجبة كنتاكي 5 قطع", price: 12000, category: "chicken", stock: 50, crop: [146, 777, 99, 91] },
        { id: "chicken-7", name: "وجبة كنتاكي 7 قطع", price: 15000, category: "chicken", stock: 50, crop: [263, 776, 102, 94] },
        { id: "family-box", name: "بوكس فور تي العائلي", price: 25000, category: "family", stock: 50, crop: [395, 781, 219, 123] },
        { id: "finger", name: "فدق فنكر", price: 1000, category: "snacks", stock: 50, crop: [35, 978, 69, 84] },
        { id: "finger-small", name: "ماعون فنكر صغير", price: 2000, category: "snacks", stock: 50, crop: [136, 982, 69, 80] },
        { id: "finger-cheese", name: "ماعون فنكر بالجبنة", price: 3000, category: "snacks", stock: 50, crop: [229, 976, 76, 87] },
        { id: "finger-meat", name: "ماعون فنكر باللحم", price: 5000, category: "snacks", stock: 50, crop: [327, 970, 83, 93] },
        { id: "pepsi", name: "بيبسي", price: 500, category: "drinks", stock: 50, crop: [452, 976, 59, 86] },
        { id: "diet-pepsi", name: "بيبسي دايت", price: 500, category: "drinks", stock: 50, crop: [534, 976, 61, 86] },
        { id: "seven-up", name: "سفن", price: 500, category: "drinks", stock: 50, crop: [618, 978, 59, 84] }
      ];

      try {
        for (const item of initialMenu) {
          await setDoc(doc(db, "products", item.id), {
            name: item.name,
            price: item.price,
            category: item.category,
            stock: item.stock,
            crop: item.crop,
            createdAt: serverTimestamp()
          });
        }
        msg.style.color = "#4caf50";
        msg.innerText = "✅ تم رفع جميع الوجبات بنجاح مع كمية 50 لكل منها!";
        loadProducts();
      } catch (error) {
        msg.style.color = "#ee4636";
        msg.innerText = "❌ حدث خطأ: " + error.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 رفع جميع الوجبات";
      }
    };

    window.updatePromoImage = async () => {
      const url = document.getElementById("promoImageUrl").value.trim();
      const msg = document.getElementById("promoMsg");
      try {
        await setDoc(doc(db, "settings", "config"), { promoImage: url }, { merge: true });
        msg.style.color = "#4caf50";
        msg.innerText = url ? "✅ تم تحديث صورة العرض بنجاح!" : "✅ تم إزالة صورة العرض.";
        document.getElementById("promoImageUrl").value = "";
      } catch (error) {
        msg.style.color = "#ee4636";
        msg.innerText = "❌ حدث خطأ: " + error.message;
      }
    };

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("msg");
      
      const id = document.getElementById("editProductId").value;
      const name = document.getElementById("prodName").value;
      const price = parseInt(document.getElementById("prodPrice").value);
      const category = document.getElementById("prodCategory").value;
      const stock = parseInt(document.getElementById("prodStock").value);
      const imageUrl = document.getElementById("prodImage").value.trim();

      btn.disabled = true;
      btn.innerText = "جاري الحفظ...";
      msg.innerText = "";

      const productData = { name, price, category, stock, createdAt: serverTimestamp() };
      if (imageUrl) productData.image = imageUrl;

      try {
        if (id) {
          await updateDoc(doc(db, "products", id), productData);
          msg.style.color = "#4caf50";
          msg.innerText = "✅ تم تعديل الوجبة بنجاح!";
        } else {
          await addDoc(collection(db, "products"), productData);
          msg.style.color = "#4caf50";
          msg.innerText = "✅ تمت إضافة الوجبة بنجاح!";
        }
        resetForm();
        loadProducts();
      } catch (error) {
        msg.style.color = "#ee4636";
        msg.innerText = "❌ حدث خطأ: " + error.message;
      } finally {
        btn.disabled = false;
        btn.innerText = id ? "حفظ التعديلات" : "إضافة الوجبة للموقع";
      }
    });

    window.editProduct = (id) => {
      const product = allProducts.find(p => p.id === id);
      if (!product) return;

      document.getElementById("editProductId").value = product.id;
      document.getElementById("prodName").value = product.name;
      document.getElementById("prodPrice").value = product.price;
      document.getElementById("prodCategory").value = product.category;
      // هنا يتم جلب الكمية، إذا لم توجد يجعلها 50
      document.getElementById("prodStock").value = product.stock !== undefined ? product.stock : 50;
      document.getElementById("prodImage").value = product.image || "";
      
      document.getElementById("formTitle").innerText = "✏️ تعديل الوجبة";
      document.getElementById("submitBtn").innerText = "حفظ التعديلات";
      document.getElementById("cancelEditBtn").style.display = "block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.cancelEdit = () => { resetForm(); };

    function resetForm() {
      document.getElementById("addForm").reset();
      document.getElementById("editProductId").value = "";
      document.getElementById("formTitle").innerText = "🍔 إضافة / تعديل وجبة";
      document.getElementById("submitBtn").innerText = "إضافة الوجبة للموقع";
      document.getElementById("cancelEditBtn").style.display = "none";
    }

    window.setFilter = (filter) => {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      });
      renderProductsList();
    };

    async function loadProducts() {
      const list = document.getElementById("productsList");
      list.innerHTML = "جاري التحميل...";
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        allProducts = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allProducts.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
        renderProductsList();
      } catch (error) {
        list.innerHTML = "حدث خطأ في جلب البيانات.";
      }
    }

    function renderProductsList() {
      const list = document.getElementById("productsList");
      let filtered = allProducts;
      if (currentFilter !== 'all') {
        filtered = allProducts.filter(p => p.category === currentFilter);
      }
      if (filtered.length === 0) {
        list.innerHTML = `<p style='text-align:center; color:#888;'>لا توجد وجبات في هذا القسم.</p>`;
        return;
      }

      list.innerHTML = filtered.map(data => {
        // إذا كانت الكمية غير موجودة نعتبرها 50
        const currentStock = data.stock !== undefined ? data.stock : 50;
        const isOut = currentStock <= 0;

        return `
        <div class="product-item">
          <div class="product-info">
            <h4>${data.name}</h4>
            <p>السعر: ${data.price} د.ع | القسم: ${catNames[data.category] || data.category}</p>
            <span class="stock-badge ${isOut ? 'stock-out' : 'stock-in'}">
              ${isOut ? 'نفذت الكمية' : `المتوفر: ${currentStock} قطعة`}
            </span>
          </div>
          <div class="product-actions">
            <button class="btn-edit" onclick="editProduct('${data.id}')">تعديل</button>
            <button class="btn-danger" onclick="deleteProduct('${data.id}')">حذف</button>
          </div>
        </div>
      `}).join("");
    }

    window.deleteProduct = async (id) => {
      if(confirm("هل أنت متأكد من حذف هذه الوجبة نهائياً؟")) {
        try { 
          await deleteDoc(doc(db, "products", id)); 
          loadProducts(); 
        } catch (error) { 
          alert("خطأ في الحذف: " + error.message); 
        }
      }
    };
  </script>
</body>
</html>
